name: Sync Docs to Portal

# Pushes this repo's own docs (README, AGENTS.md, docs/, knowledge/,
# .agents/skills/*/SKILL.md) into the sanjeev-ai docs-portal's Firestore,
# tagged project:'swarmkit', so they render at /swarmkit/... there without
# the portal itself needing to redeploy.
#
# Requires a repo secret holding a Firebase service account JSON key with
# Firestore write access to the target docs-portal-staging/prod project.
# See knowledge/infrastructure.md for how to provision one — this workflow
# does not create it for you. Until the secret exists the job SKIPS (see the
# `if:` guard below) rather than failing red on every push.
#
# PORTABILITY: this pipeline targets the sanjeev-ai docs-portal specifically
# (the project this template was extracted from). If you cloned SwarmKit for
# your own project, either delete this workflow or repoint it at your own
# docs surface — it is not part of the portable swarm rulebook.

on:
  push:
    branches:
      - master
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - 'knowledge/**'
      - '.agents/skills/**'
      - 'scripts/syncDocs.ts'
      - '.github/workflows/sync-docs.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which docs-portal project to sync to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    # `secrets` is not available in a job-level `if:`, so surface presence as a
    # job-level env var (which CAN read secrets) and gate the steps on it. Until
    # the secret is provisioned the steps skip and the job stays green, rather
    # than failing red on every push. A manual run always proceeds.
    env:
      HAS_STAGING_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCS_PORTAL_STAGING != '' }}
    steps:
      - if: ${{ env.HAS_STAGING_SECRET == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
      - if: ${{ env.HAS_STAGING_SECRET == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - if: ${{ env.HAS_STAGING_SECRET == 'true' || github.event_name == 'workflow_dispatch' }}
        run: npm install
      - name: Sync docs
        if: ${{ env.HAS_STAGING_SECRET == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_STAGING: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCS_PORTAL_STAGING }}
          FIREBASE_SERVICE_ACCOUNT_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DOCS_PORTAL_PROD }}
        run: |
          TARGET="${{ github.event.inputs.target || 'staging' }}"
          if [ "$TARGET" = "prod" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_PROD" > /tmp/sa.json
            PROJECT_ID="docs-portal-prod"
          else
            echo "$FIREBASE_SERVICE_ACCOUNT_STAGING" > /tmp/sa.json
            PROJECT_ID="docs-portal-staging"
          fi
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          npm run sync:docs -- --env=staging --project-id=$PROJECT_ID
