name: privacy-guard

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: privacy-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check diff, commit messages, and commit emails
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/privacy-check.mjs --ci --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
          else
            node scripts/privacy-check.mjs --ci --base "${{ github.event.before }}" --head "${{ github.sha }}"
          fi

      - name: Scan for credentials (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
